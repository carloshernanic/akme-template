questions:
  - id: CQ-001
    question: Qual o faturamento por UF no ultimo trimestre?
    expects:
      - Pedido type Class
      - Pedido pertenceA Cliente
      - Faturamento subclassOf Metric
    answer: vl_total
  - id: CQ-002
    question: Quais clientes ativos nao compraram nos ultimos 90 dias?
    expects:
      - Cliente type Class
      - Cliente possuiPedido Pedido
    answer: financeiro
  - id: CQ-003
    question: Qual o ticket medio por categoria de produto?
    expects:
      - ItemPedido referencia Produto
      - Pedido contem ItemPedido
    answer: categoria
