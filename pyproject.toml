[project]
name = "akme-template"
version = "0.1.0"
description = "Template para construir, validar e publicar uma ontologia e camada semantica com LOT + NeOn e humano no loop"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.2,<2",
    "rdflib>=7.0",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
snowflake = ["snowflake-connector-python>=3.7"]
databricks = ["databricks-sql-connector>=3.1"]
rdf = ["morph-kgc>=2.8"]
pdf = ["pypdf>=4.0"]
office = ["openpyxl>=3.1", "python-docx>=1.1", "python-pptx>=1.0"]
dev = ["pytest>=8.0", "akme-template[office,pdf]"]

[project.scripts]
akme = "akme.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["akme"]

[tool.pytest.ini_options]
testpaths = ["tests"]
