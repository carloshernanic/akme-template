<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Akme: ontologia</title>
<meta name="description" content="Grafo da ontologia, termos, mappings, glossario, cobertura e pitfalls do ultimo validate.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Roboto+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
:root {
  --mist-50: oklch(100% 0 0);
  --mist-100: oklch(98.54% 0.0013 286.38);
  --mist-300: oklch(96.37% 0.0017 247.84);
  --mist-400: oklch(94.49% 0.0025 228.79);
  --slate-300: oklch(30.29% 0.0203 273.16);
  --slate-600: oklch(25.44% 0.0231 273.73);
  --slate-700: oklch(23.76% 0.0235 273.59);
  --slate-800: oklch(22.43% 0.022 272.68);
  --slate-900: oklch(20.64% 0.0205 271.56);
  --slate-950: oklch(18.46% 0.0187 274.71);
  --qb-accent: oklch(69.89% 0.1572 238.91);

  --surface-base: var(--mist-100);
  --surface-primary: var(--mist-50);
  --surface-secondary: var(--mist-400);
  --fill-ui-1: var(--mist-100);
  --fill-ui-2: var(--mist-300);
  --fill-subtle: oklch(20.64% 0.0205 271.56 / calc(15 / 255));
  --fill-muted: oklch(20.64% 0.0205 271.56 / calc(20 / 255));
  --fill-active: var(--slate-950);
  --text-primary: oklch(20.64% 0.0205 271.56 / calc(224 / 255));
  --text-secondary: oklch(20.64% 0.0205 271.56 / calc(153 / 255));
  --text-tertiary: oklch(20.64% 0.0205 271.56 / calc(128 / 255));
  --text-inverse: oklch(100% 0 0 / calc(224 / 255));
  --text-information: #0369a1;
  --text-error: #b91c1c;
  --text-warning: #b45309;
  --text-success: #15803d;
  --border-divider: oklch(20.64% 0.0205 271.56 / calc(26 / 255));
  --border-tertiary: oklch(20.64% 0.0205 271.56 / calc(41 / 255));
  --border-secondary: oklch(20.64% 0.0205 271.56 / calc(61 / 255));
  --border-active: var(--slate-950);
  --border-focus: #0ea5e9;
  --status-success: #16a34a;
  --status-error: #dc2626;
  --status-warning: #d97706;
  --status-information: #0284c7;
  --shade-t: oklch(20.64% 0.0205 271.56 / calc(20 / 255));
  --shade: oklch(20.64% 0.0205 271.56 / calc(97 / 255));
  --overlay-hover: oklch(20.64% 0.0205 271.56 / calc(20 / 255));

  --font-sans: "Inter", "Segoe UI", Arial, sans-serif;
  --font-mono: "Roboto Mono", Consolas, monospace;
  --header-h: 56px;
  --sidebar-w: 16rem;
  --inset: 24px;
}
:root:not([data-theme="light"]) {
  @media (prefers-color-scheme: dark) {
    --surface-base: var(--slate-900);
    --surface-primary: var(--slate-800);
    --surface-secondary: var(--slate-700);
    --fill-ui-1: var(--slate-600);
    --fill-ui-2: var(--slate-300);
    --fill-subtle: oklch(100% 0 0 / calc(15 / 255));
    --fill-muted: oklch(100% 0 0 / calc(20 / 255));
    --fill-active: var(--mist-50);
    --text-primary: oklch(100% 0 0 / calc(224 / 255));
    --text-secondary: oklch(100% 0 0 / calc(153 / 255));
    --text-tertiary: oklch(100% 0 0 / calc(128 / 255));
    --text-inverse: oklch(20.64% 0.0205 271.56 / calc(224 / 255));
    --text-information: #38bdf8;
    --text-error: #f87171;
    --text-warning: #fbbf24;
    --text-success: #4ade80;
    --border-divider: oklch(100% 0 0 / calc(20 / 255));
    --border-tertiary: oklch(100% 0 0 / calc(41 / 255));
    --border-secondary: oklch(100% 0 0 / calc(97 / 255));
    --border-active: var(--mist-50);
    --border-focus: #38bdf8;
    --status-success: #4ade80;
    --status-error: #f87171;
    --status-warning: #fbbf24;
    --status-information: #38bdf8;
    --shade-t: oklch(20.64% 0.0205 271.56 / calc(224 / 255));
    --shade: oklch(20.64% 0.0205 271.56 / calc(224 / 255));
    --overlay-hover: oklch(100% 0 0 / calc(20 / 255));
  }
}
:root[data-theme="dark"] {
  --surface-base: var(--slate-900);
  --surface-primary: var(--slate-800);
  --surface-secondary: var(--slate-700);
  --fill-ui-1: var(--slate-600);
  --fill-ui-2: var(--slate-300);
  --fill-subtle: oklch(100% 0 0 / calc(15 / 255));
  --fill-muted: oklch(100% 0 0 / calc(20 / 255));
  --fill-active: var(--mist-50);
  --text-primary: oklch(100% 0 0 / calc(224 / 255));
  --text-secondary: oklch(100% 0 0 / calc(153 / 255));
  --text-tertiary: oklch(100% 0 0 / calc(128 / 255));
  --text-inverse: oklch(20.64% 0.0205 271.56 / calc(224 / 255));
  --text-information: #38bdf8;
  --text-error: #f87171;
  --text-warning: #fbbf24;
  --text-success: #4ade80;
  --border-divider: oklch(100% 0 0 / calc(20 / 255));
  --border-tertiary: oklch(100% 0 0 / calc(41 / 255));
  --border-secondary: oklch(100% 0 0 / calc(97 / 255));
  --border-active: var(--mist-50);
  --border-focus: #38bdf8;
  --status-success: #4ade80;
  --status-error: #f87171;
  --status-warning: #fbbf24;
  --status-information: #38bdf8;
  --shade-t: oklch(20.64% 0.0205 271.56 / calc(224 / 255));
  --shade: oklch(20.64% 0.0205 271.56 / calc(224 / 255));
  --overlay-hover: oklch(100% 0 0 / calc(20 / 255));
}

* { box-sizing: border-box; min-width: 0; }
html { -webkit-font-smoothing: antialiased; }
body {
  margin: 0;
  background: var(--surface-base);
  color: var(--text-primary);
  font-family: var(--font-sans);
  font-size: 16px;
  line-height: 24px;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
:focus-visible { outline: 3px solid var(--border-focus); outline-offset: 1px; }
h1, h2, h3, p, ul { margin: 0; }
ul { padding: 0; list-style: none; }
code, .mono { font-family: var(--font-mono); font-size: 14px; }

.h2 { font-size: 24px; line-height: 32px; font-weight: 600; letter-spacing: -0.096px; }
.h3 { font-size: 20px; line-height: 28px; font-weight: 400; }
.p { font-size: 14px; line-height: 20px; letter-spacing: -0.028px; }
.p-lg { font-size: 16px; line-height: 24px; }
.label { font-size: 12px; line-height: 16px; }
.kind { font-size: 10px; line-height: 1; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-tertiary); }
.secondary { color: var(--text-secondary); }
.tertiary { color: var(--text-tertiary); }

.app { display: grid; grid-template-columns: var(--sidebar-w) 1fr; min-height: 100dvh; }
.sidebar {
  position: sticky; top: 0; height: 100dvh; overflow-y: auto;
  background: var(--surface-primary); border-right: 1px solid var(--border-divider);
  display: flex; flex-direction: column;
}
.sidebar-head { height: var(--header-h); display: flex; align-items: center; gap: 10px; padding: 0 16px; border-bottom: 1px solid var(--border-divider); flex-shrink: 0; }
.logo { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 16px; }
.logo svg { width: 22px; height: 22px; }
.sidebar-body { padding: 12px 8px 24px; display: flex; flex-direction: column; gap: 16px; }
.group-label { padding: 4px 8px 8px; text-transform: uppercase; color: var(--text-tertiary); font-size: 12px; line-height: 16px; }
.nav-item {
  display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
  padding: 6px 8px; font-size: 14px; line-height: 20px; color: var(--text-primary);
  transition: background 140ms;
}
.nav-item:hover { background-image: linear-gradient(var(--overlay-hover), var(--overlay-hover)); }
.nav-item[aria-pressed="true"] { background: var(--fill-subtle); font-weight: 600; }
.nav-item .count { margin-left: auto; color: var(--text-tertiary); font-size: 12px; }
.nav-sub { padding-left: 20px; }
.search { position: relative; margin: 0 8px; }
.search input {
  width: 100%; height: 36px; padding: 0 12px 0 36px; background: var(--surface-primary);
  border: 1px solid var(--border-secondary); color: var(--text-primary); font-size: 14px;
}
.search input:focus { outline: 3px solid var(--border-focus); outline-offset: 0; border-color: var(--border-focus); }
.search svg { position: absolute; left: 10px; top: 10px; width: 16px; height: 16px; color: var(--text-tertiary); pointer-events: none; }

.main { display: flex; flex-direction: column; min-width: 0; }
.header {
  position: sticky; top: 0; z-index: 10; height: var(--header-h); display: flex; align-items: center; gap: 12px;
  padding: 0 16px; border-bottom: 1px solid var(--border-divider);
  background: color-mix(in oklch, var(--surface-primary) 92%, transparent); backdrop-filter: blur(8px);
}
.header .title { font-size: 14px; line-height: 20px; }
.header .spacer { margin-left: auto; }
.icon-btn { width: 36px; height: 36px; display: grid; place-items: center; color: var(--text-secondary); transition: background 140ms; }
.icon-btn:hover { background-image: linear-gradient(var(--overlay-hover), var(--overlay-hover)); }
.icon-btn svg { width: 18px; height: 18px; }
.menu-btn { display: none; }

.content { width: 100%; max-width: 88rem; margin: 0 auto; padding: 24px 16px 48px; display: flex; flex-direction: column; gap: 24px; }
@media (min-width: 640px) { .content { padding: 36px 28px 64px; } }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
.card { background: var(--fill-ui-1); box-shadow: 0 1px 1px 0 var(--shade-t), 0 0 1px 0 var(--shade); padding: var(--inset); display: flex; flex-direction: column; gap: 8px; }
.card.high { background: var(--fill-ui-2); }
.stat .value { font-size: 32px; line-height: 32px; font-weight: 600; font-variant-numeric: tabular-nums; }
.stat .label { color: var(--text-secondary); }

.workspace { display: grid; grid-template-columns: minmax(0, 1fr) 22rem; gap: 24px; align-items: start; }
.graph-card { padding: 0; overflow: hidden; }
.graph-head { display: flex; align-items: center; gap: 12px; padding: 20px var(--inset) 12px; }
.graph-head .legend { margin-left: auto; display: flex; flex-wrap: wrap; gap: 12px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; line-height: 16px; color: var(--text-secondary); }
.legend i { width: 18px; height: 0; border-top: 1.5px solid var(--text-secondary); }
.legend i.dashed { border-top-style: dashed; }
.legend b { width: 10px; height: 10px; border-radius: 9999px; border: 1.5px solid var(--qb-accent); background: var(--surface-primary); }
.graph-wrap { position: relative; height: 560px; background-color: var(--surface-primary); background-image: radial-gradient(var(--border-tertiary) 1px, transparent 1px); background-size: 18px 18px; border-top: 1px solid var(--border-divider); }
svg.graph { width: 100%; height: 100%; display: block; touch-action: none; }
.node { cursor: pointer; }
.node circle { fill: var(--surface-primary); stroke: var(--border-secondary); stroke-width: 1.5; transition: stroke 140ms, fill 140ms; }
.node.root circle { fill: var(--fill-ui-2); stroke: var(--border-tertiary); }
.node.metric circle { stroke-dasharray: 3 3; }
.node:hover circle { stroke: var(--border-active); }
.node.selected circle { stroke: var(--qb-accent); stroke-width: 2.5; }
.node text { font-family: var(--font-sans); font-size: 12px; fill: var(--text-primary); pointer-events: none; }
.node text.kind { font-size: 9px; letter-spacing: 0.12em; fill: var(--text-tertiary); text-transform: uppercase; }
.edge { fill: none; stroke: var(--text-secondary); stroke-width: 1.2; }
.edge.sub { stroke: var(--border-secondary); stroke-dasharray: 4 4; }
.edge.dim { opacity: 0.25; }
.edge-label { font-family: var(--font-sans); font-size: 11px; fill: var(--text-secondary); paint-order: stroke; stroke: var(--surface-primary); stroke-width: 4px; stroke-linejoin: round; pointer-events: none; }
.graph-empty { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; color: var(--text-secondary); }

.panel { position: sticky; top: calc(var(--header-h) + 24px); display: flex; flex-direction: column; gap: 0; padding: 0; }
.panel-head { padding: var(--inset) var(--inset) 16px; display: flex; flex-direction: column; gap: 6px; }
.panel-section { padding: 16px var(--inset); border-top: 1px solid var(--border-divider); display: flex; flex-direction: column; gap: 8px; }
.panel-section h3 { font-size: 12px; line-height: 16px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-tertiary); font-weight: 500; }
.row { display: flex; gap: 8px; align-items: baseline; font-size: 14px; line-height: 20px; }
.row .k { color: var(--text-secondary); flex-shrink: 0; min-width: 7rem; }
.chip { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 8px; border-radius: 9999px; font-size: 12px; line-height: 16px; white-space: nowrap; }
.chip.alt { background: var(--fill-muted); color: var(--text-secondary); }
.chip.high { background: var(--fill-active); color: var(--text-inverse); }
.chip.success { background: var(--status-success); color: var(--text-inverse); }
.chip.warning { background: var(--status-warning); color: var(--text-inverse); }
.chip.error { background: var(--status-error); color: var(--text-inverse); }
.chip.outline { background: transparent; color: var(--text-secondary); outline: 1px solid var(--border-secondary); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }

.summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 24px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; line-height: 20px; }
th { text-align: left; color: var(--text-secondary); font-weight: 500; border-bottom: 1px solid var(--border-tertiary); padding: 8px 8px 8px 0; white-space: nowrap; }
td { vertical-align: top; padding: 8px 8px 8px 0; border-bottom: 1px solid var(--border-divider); }
tr:last-child td { border-bottom: 0; }
.bar { height: 8px; background: var(--fill-muted); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--fill-active); }
.bar.ok > i { background: var(--status-success); }
.callout { display: flex; gap: 12px; padding: 16px; background: var(--fill-subtle); }
.callout svg { width: 20px; height: 20px; flex-shrink: 0; }
.callout.info svg { color: var(--status-information); }
.callout.warn svg { color: var(--status-warning); }
.callout .t { font-weight: 600; font-size: 14px; line-height: 20px; }
.callout .b { font-size: 14px; line-height: 20px; color: var(--text-secondary); }
.status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 9999px; margin-right: 6px; vertical-align: middle; }
.status-dot.success { background: var(--status-success); }
.status-dot.error { background: var(--status-error); }
.status-dot.warning { background: var(--status-warning); }
.status-dot.neutral { background: var(--fill-active); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (max-width: 1100px) { .workspace { grid-template-columns: 1fr; } .panel { position: static; } }
@media (max-width: 768px) {
  .app { grid-template-columns: 1fr; }
  .sidebar { position: fixed; left: 0; top: 0; width: 18rem; max-width: 85vw; z-index: 20; transform: translateX(-100%); transition: transform 160ms; box-shadow: 0 4px 8px 0 var(--shade-t), 0 2px 4px -1px var(--shade); }
  .sidebar.open { transform: none; }
  .menu-btn { display: grid; }
  .graph-wrap { height: 420px; }
}
/* aba Revisao (docs/review.js) */
[hidden] { display: none !important; }
.tabs { display: flex; gap: 4px; margin-left: 8px; }
.rv-tab { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 6px; font-size: 14px; line-height: 20px; color: var(--text-secondary); transition: background 140ms; }
.rv-tab:hover { background-image: linear-gradient(var(--overlay-hover), var(--overlay-hover)); }
.rv-tab[aria-selected="true"] { background: var(--fill-active); color: var(--text-inverse); font-weight: 600; }
.rv-count:empty { display: none; }
.rv-count { font-size: 11px; line-height: 16px; padding: 0 6px; border-radius: 9999px; outline: 1px solid currentColor; }
.rv-banner { display: flex; gap: 12px; padding: 12px 16px; background: var(--surface-primary); color: var(--text-primary); border: 1px solid var(--status-warning); border-left-width: 4px; font-size: 14px; line-height: 20px; }
.rv-banner-t { font-weight: 600; }
.rv-banner ul, .rv-ul { list-style: disc; padding-left: 20px; }
.rv { display: flex; flex-direction: column; gap: 16px; color: var(--text-primary); }
.rv-toolbar { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 24px; }
.rv-toolbar > div:first-child { flex: 1 1 24rem; display: flex; flex-direction: column; gap: 4px; }
.rv-reviewer { display: flex; flex-direction: column; gap: 4px; width: 16rem; max-width: 100%; }
.rv-body { display: flex; flex-direction: column; gap: 24px; }
.rv-section { display: flex; flex-direction: column; gap: 12px; scroll-margin-top: calc(var(--header-h) + 16px); }
.rv-grp { font-size: 12px; line-height: 16px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-secondary); }
.rv-sub { font-size: 12px; line-height: 16px; font-weight: 500; color: var(--text-tertiary); }
.rv-card { background: var(--surface-primary); color: var(--text-primary); border: 1px solid var(--border-tertiary); border-radius: 10px; padding: 16px; display: grid; grid-template-columns: minmax(0, 1fr) 16rem; gap: 16px; }
.rv-card.rv-wide { grid-template-columns: 1fr; gap: 6px; }
.rv-card.rv-ctx { background: var(--fill-ui-1); }
.rv-card.rv-dim .rv-main { opacity: 0.6; }
.rv-card.rv-invalid { border-color: var(--status-error); box-shadow: 0 0 0 1px var(--status-error); }
.rv-main { display: flex; flex-direction: column; gap: 8px; }
.rv-id { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 12px; line-height: 16px; color: var(--text-secondary); }
.rv-edited { color: var(--text-warning); }
.rv-q { font-size: 16px; line-height: 24px; font-weight: 600; color: var(--text-primary); }
.rv-qbox { padding: 8px 10px; border: 1px solid var(--border-tertiary); border-radius: 6px; }
.rv-qbox.rv-gap { border-color: var(--status-error); }
.rv-qbox.rv-div { border-color: var(--status-warning); }
.rv-meta { align-items: center; }
.rv-row2 { display: grid; grid-template-columns: 14rem minmax(0, 1fr); gap: 12px; align-items: start; }
.rv-field { display: flex; flex-direction: column; gap: 4px; }
.rv-concepts { margin-top: 6px; }
.rv-input { width: 100%; padding: 6px 8px; border: 1px solid var(--border-secondary); border-radius: 6px; background: var(--surface-primary); color: var(--text-primary); font-family: var(--font-sans); font-size: 14px; line-height: 20px; }
.rv-input::placeholder { color: var(--text-tertiary); }
.rv-input:focus { outline: 3px solid var(--border-focus); outline-offset: 0; border-color: var(--border-focus); }
textarea.rv-input { resize: vertical; min-height: 56px; }
textarea.rv-q { border-style: dashed; font-size: 16px; line-height: 24px; font-weight: 600; }
select.rv-input option { background: var(--surface-primary); color: var(--text-primary); }
.rv :disabled { cursor: not-allowed; opacity: 0.55; }
.rv-ev { display: flex; flex-direction: column; gap: 4px; padding: 6px 10px; border-left: 3px solid var(--status-information); border-radius: 4px; background: var(--fill-subtle); font-size: 13px; line-height: 20px; color: var(--text-primary); }
.rv-ev.b { border-left-color: var(--status-warning); }
.rv-path { font-family: var(--font-mono); font-size: 12px; color: var(--text-information); }
.rv-dec { display: flex; flex-direction: column; gap: 8px; padding-left: 16px; border-left: 1px solid var(--border-divider); }
.rv-lbl { font-size: 11px; line-height: 16px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-secondary); }
.rv-seg { display: flex; border: 1px solid var(--border-secondary); border-radius: 6px; overflow: hidden; background: var(--surface-primary); }
.rv-seg.rv-col { flex-direction: column; }
.rv-seg button { flex: 1; padding: 5px 8px; font-size: 13px; line-height: 18px; text-align: center; color: var(--text-primary); }
.rv-seg.rv-col button { text-align: left; }
.rv-seg button + button { border-left: 1px solid var(--border-tertiary); }
.rv-seg.rv-col button + button { border-left: 0; border-top: 1px solid var(--border-tertiary); }
.rv-seg button:hover:not(:disabled) { background-image: linear-gradient(var(--overlay-hover), var(--overlay-hover)); }
.rv-seg button[aria-pressed="true"] { background: var(--fill-active); color: var(--text-inverse); font-weight: 600; }
.rv-seg button.rv-no[aria-pressed="true"] { background: var(--status-error); color: var(--text-inverse); }
.rv-seg button:focus-visible { outline-offset: -3px; }
.rv-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.rv-btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 7px 14px; border-radius: 8px; background: var(--fill-active); color: var(--text-inverse); font-size: 14px; line-height: 20px; font-weight: 600; }
.rv-btn.rv-ghost { background: transparent; color: var(--text-primary); border: 1px solid var(--border-secondary); }
.rv-btn.rv-small { padding: 4px 10px; font-size: 13px; line-height: 18px; font-weight: 500; }
.rv-link { color: var(--text-information); font-size: 12px; text-decoration: underline; }
.rv-checked { color: var(--text-secondary); font-size: 12px; }
.rv-new { width: 100%; padding: 14px 16px; text-align: left; border: 1px dashed var(--border-secondary); border-radius: 10px; color: var(--text-primary); font-size: 14px; line-height: 20px; }
.rv-new:hover:not(:disabled) { background-image: linear-gradient(var(--overlay-hover), var(--overlay-hover)); }
.rv-fieldset { border: 0; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 4px 16px; }
.rv-fieldset legend { padding: 0; margin-bottom: 4px; }
.rv-checkbox { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; line-height: 20px; }
.rv-diff th, .rv-diff td { padding: 6px 8px 6px 0; }
.rv-kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 12px; margin: 0; font-size: 14px; line-height: 20px; }
.rv-kv dd { margin: 0; overflow-wrap: anywhere; }
.rv-foot { position: sticky; bottom: 0; z-index: 5; display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 12px 16px; background: var(--surface-primary); color: var(--text-primary); border: 1px solid var(--border-tertiary); border-radius: 10px; box-shadow: 0 -2px 8px 0 var(--shade-t); }
.rv-msg { font-size: 13px; line-height: 18px; }
.rv-msg.error { color: var(--text-error); }
.rv-msg.success { color: var(--text-success); }
.rv-msg.info { color: var(--text-secondary); }
.rv-hint { margin-left: auto; text-align: right; font-size: 12px; line-height: 18px; color: var(--text-secondary); }
@media (max-width: 900px) {
  .rv-card { grid-template-columns: 1fr; }
  .rv-dec { padding-left: 0; border-left: 0; padding-top: 12px; border-top: 1px solid var(--border-divider); }
  .rv-row2 { grid-template-columns: 1fr; }
  .rv-hint { margin-left: 0; text-align: left; }
}
@media (max-width: 640px) { .tabs { margin-left: 0; } .header .title, #version { display: none; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: 0.01ms !important; } }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar" aria-label="Classes da ontologia">
    <div class="sidebar-head">
      <div class="logo" aria-label="Akme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="6" cy="6" r="2.4"/><circle cx="18" cy="6" r="2.4"/><circle cx="12" cy="18" r="2.4"/><path d="M8 7.2l2.8 8.4M16 7.2l-2.8 8.4M8.4 6h7.2"/></svg>
        Akme
      </div>
      <span class="label tertiary">ontologia</span>
    </div>
    <div class="sidebar-body">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="search" type="search" placeholder="Buscar classe, termo ou sigla" aria-label="Buscar classe, termo ou sigla">
      </div>

<script src="ontology.js"></script>
<script src="review.js"></script>
<script>
const $ = (sel, el = document) => el.querySelector(sel);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ROOTS = ["Entity", "Relation", "Rule", "Metric"];
const ICONS = {
  info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>',
  warn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l10 18H2L12 3zM12 10v4M12 17h.01"/></svg>',
};
let DATA = null, selected = null, graph = null;

function setTheme(mode) {
  if (mode) document.documentElement.setAttribute("data-theme", mode); else document.documentElement.removeAttribute("data-theme");
  const dark = mode === "dark" || (!mode && matchMedia("(prefers-color-scheme: dark)").matches);
  $("#icon-sun").style.display = dark ? "" : "none";
  $("#icon-moon").style.display = dark ? "none" : "";
  try { mode ? localStorage.setItem("akme-theme", mode) : localStorage.removeItem("akme-theme"); } catch (e) {}
}
$("#theme").addEventListener("click", () => {
  const dark = document.documentElement.getAttribute("data-theme") === "dark" || (!document.documentElement.getAttribute("data-theme") && matchMedia("(prefers-color-scheme: dark)").matches);
  setTheme(dark ? "light" : "dark");
});
$("#menu").addEventListener("click", () => {
  const open = $("#sidebar").classList.toggle("open");
  $("#menu").setAttribute("aria-expanded", String(open));
});
let saved = null; try { saved = localStorage.getItem("akme-theme"); } catch (e) {}
setTheme(saved);

// modo editavel quando servida por `akme review`; como arquivo, api = null (modo leitura)
async function detectApi() {
  if (location.protocol !== "http:" && location.protocol !== "https:") return null;
  try {
    const r = await fetch("/api/status", { headers: { Accept: "application/json" } });
    if (!r.ok) return null;
    await r.json();
  } catch (e) { return null; }
  const call = async (path, opts) => {
    const r = await fetch(path, opts);
    let body = null;
    try { body = await r.json(); } catch (e) {}
    if (!r.ok) throw new Error((body && body.error) || "HTTP " + r.status);
    return body;
  };
  return {
    get: (path) => call(path, { headers: { Accept: "application/json" } }),
    post: (path, data) => call(path, { method: "POST", headers: { "Content-Type": "application/json", Accept: "application/json" }, body: JSON.stringify(data) }),
  };
}

async function load() {
  if (window.AKME_DATA) return window.AKME_DATA;
  const r = await fetch("ontology.json");
  if (!r.ok) throw new Error("ontology.json nao encontrado");
  return r.json();
}

function termsOf(cls) { return DATA.terms.filter((t) => t.class === cls); }
function mappingsOf(term) { return DATA.mappings.filter((m) => m.term === term); }
function relationsOf(cls) { return DATA.relations.filter((r) => r.domain.includes(cls) || r.range.includes(cls)); }

function renderStats() {
  const v = DATA.validation;
  const cov = v && v.coverage && v.coverage.available ? v.coverage : null;
  const pit = v ? v.pitfalls.length : null;
  const cards = [
    { label: "classes", value: DATA.classes.length },
    { label: "relacoes", value: DATA.relations.length },
    { label: "termos", value: DATA.terms.length },
    { label: "mappings", value: DATA.mappings.length },
    { label: "cobertura de colunas", value: cov ? Math.round(cov.ratio * 100) + "%" : "n/a" },
    { label: "pitfalls", value: pit === null ? "n/a" : pit },
  ];
  $("#stats").innerHTML = cards.map((c) => `<div class="card stat"><div class="value">${esc(c.value)}</div><div class="label p">${esc(c.label)}</div></div>`).join("");
}

function renderNav(filter = "") {
  const q = filter.trim().toLowerCase();
  const matchClass = (c) => !q || [c.name, c.label, c.comment, ...termsOf(c.name).map((t) => t.name)].some((x) => String(x).toLowerCase().includes(q));
  const children = (parent) => DATA.classes.filter((c) => c.subclass_of.includes(parent));
  const item = (c, depth) => `<li><button class="nav-item" data-class="${esc(c.name)}" aria-pressed="${selected === c.name}" style="padding-left:${8 + depth * 14}px">
      <span>${esc(c.label || c.name)}</span><span class="count">${termsOf(c.name).length || ""}</span></button>
      <ul>${children(c.name).filter(matchClass).map((k) => item(k, depth + 1)).join("")}</ul></li>`;
  const roots = DATA.classes.filter((c) => ROOTS.includes(c.name) || !c.subclass_of.length);
  const gl = DATA.glossary.filter((g) => !q || [g.acronym, g.meaning].some((x) => String(x).toLowerCase().includes(q)));
  $("#nav").innerHTML = `<div class="group-label">Classes</div><ul>${roots.filter((c) => matchClass(c) || children(c.name).some(matchClass)).map((c) => item(c, 0)).join("")}</ul>
    ${gl.length ? `<div class="group-label" style="margin-top:12px">Glossario</div><ul>${gl.map((g) => `<li class="nav-item" style="cursor:default"><span class="mono">${esc(g.acronym)}</span><span class="secondary label">${esc(g.meaning)}</span></li>`).join("")}</ul>` : ""}`;
  $("#nav").querySelectorAll("button[data-class]").forEach((b) => b.addEventListener("click", () => select(b.dataset.class)));
}
$("#search").addEventListener("input", (e) => renderNav(e.target.value));

function renderPanel() {
  const el = $("#panel");
  if (!selected) {
    el.innerHTML = `<div class="panel-head"><span class="kind">detalhes</span><h2 class="h3">Nada selecionado</h2><p class="p secondary">Escolha uma classe no grafo ou na lista para ver termos, mappings, restricoes e glossario ligados a ela.</p></div>
      <div class="panel-section"><h3>Competency questions</h3>${cqList()}</div>`;
    return;
  }
  const c = DATA.classes.find((x) => x.name === selected);
  const terms = termsOf(c.name);
  const rels = relationsOf(c.name);
  const cons = DATA.constraints.filter((k) => terms.some((t) => t.name === k.term));
  const text = (terms.map((t) => t.name + " " + t.definition).join(" ") + " " + c.comment).toUpperCase();
  const gl = DATA.glossary.filter((g) => text.includes(String(g.acronym).toUpperCase()));
  const prec = DATA.precedence.filter((p) => terms.some((t) => String(p.topic).toLowerCase().includes(t.name.replace("_", " ")) || String(p.topic).toLowerCase().includes(t.name)));
  el.innerHTML = `
    <div class="panel-head">
      <span class="kind">${esc(c.subclass_of.length ? "subclasse de " + c.subclass_of.join(", ") : "classe raiz")}</span>
      <h2 class="h3" style="font-weight:600">${esc(c.label || c.name)}</h2>
      <p class="p secondary">${esc(c.comment || "sem descricao")}</p>
      <code class="label tertiary">${esc(c.iri)}</code>
    </div>
    <div class="panel-section"><h3>Termos e mappings</h3>
      ${terms.length ? terms.map((t) => `<div><div class="row"><span style="font-weight:600">${esc(t.name)}</span>${t.synonyms && t.synonyms.length ? `<span class="label tertiary">${esc(t.synonyms.join(", "))}</span>` : ""}</div>
        <div class="p secondary">${esc(t.definition)}</div>
        <div class="chips" style="margin-top:4px">${mappingsOf(t.name).map((m) => `<span class="chip ${m.role === "metric" ? "high" : "alt"} mono" title="${esc(m.note || m.expression || "")}">${esc(m.source)}.${esc(m.column)}</span>`).join("") || '<span class="chip outline">sem mapping</span>'}</div></div>`).join("") : '<p class="p secondary">Nenhum termo ligado a esta classe.</p>'}
    </div>
    <div class="panel-section"><h3>Relacoes</h3>
      ${rels.length ? rels.map((r) => `<div class="row"><span class="mono">${esc(r.name)}</span><span class="secondary">${esc(r.domain.join(", "))} para ${esc(r.range.join(", "))}</span></div>`).join("") : '<p class="p secondary">Nenhuma relacao.</p>'}
    </div>
    ${cons.length ? `<div class="panel-section"><h3>Restricoes</h3>${cons.map((k) => `<div class="row"><span class="chip ${k.severity === "error" ? "error" : "warning"}">${esc(k.id || k.severity || "regra")}</span><span>${esc(k.rule)}</span></div>`).join("")}</div>` : ""}
    ${gl.length ? `<div class="panel-section"><h3>Glossario</h3>${gl.map((g) => `<div class="row"><span class="k mono">${esc(g.acronym)}</span><span>${esc(g.meaning)}${g.convention ? ` <span class="tertiary">(${esc(g.convention)})</span>` : ""}</span></div>`).join("")}</div>` : ""}
    ${prec.length ? `<div class="panel-section"><h3>Precedencia</h3>${prec.map((p) => `<div class="p"><b>${esc(p.topic)}</b>: ${esc(p.winner)} prevalece sobre ${esc(p.over)}.<span class="secondary"> ${esc(p.reason || "")}</span></div>`).join("")}</div>` : ""}`;
}

function cqList() {
  const cqs = DATA.requirements.competency_questions || [];
  if (!cqs.length) return '<p class="p secondary">Nenhuma competency question registrada.</p>';
  return cqs.map((q) => `<div class="row"><span class="chip ${q.status === "approved" ? "success" : "alt"}">${esc(q.id)}</span><span class="p">${esc(q.question)}</span></div>`).join("");
}

function select(name) {
  selected = selected === name ? null : name;
  renderNav($("#search").value);
  renderPanel();
  if (graph) graph.highlight(selected);
}

function renderGraph() {
  const svg = d3.select("#graph");
  svg.selectAll("*:not(title)").remove();
  const wrap = $(".graph-wrap");
  const W = wrap.clientWidth, H = wrap.clientHeight;
  if (!DATA.classes.length) { $("#graph-empty").hidden = false; $("#graph-empty").textContent = "Sem classes. Rode akme export."; return; }
  const nodes = DATA.classes.map((c) => ({ id: c.name, label: c.label || c.name, root: ROOTS.includes(c.name), kind: c.subclass_of[0] || "", metric: c.subclass_of.includes("Metric") }));
  const byId = Object.fromEntries(nodes.map((n) => [n.id, n]));
  const links = [];
  DATA.classes.forEach((c) => c.subclass_of.forEach((p) => byId[p] && links.push({ source: c.name, target: p, kind: "sub" })));
  const seenInverse = new Set();
  DATA.relations.forEach((r) => {
    if (seenInverse.has(r.name)) return;
    r.inverse_of.forEach((i) => seenInverse.add(i));
    r.domain.forEach((d) => r.range.forEach((g) => byId[d] && byId[g] && links.push({ source: d, target: g, kind: "rel", label: r.name })));
  });
  svg.append("defs").html('<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker>');
  const g = svg.append("g");
  const zoom = d3.zoom().scaleExtent([0.4, 2.5]).on("zoom", (e) => g.attr("transform", e.transform));
  svg.call(zoom);
  const sim = d3.forceSimulation(nodes)
    .force("link", d3.forceLink(links).id((d) => d.id).distance((l) => (l.kind === "sub" ? 90 : 150)))
    .force("charge", d3.forceManyBody().strength(-260))
    .force("center", d3.forceCenter(W / 2, H / 2))
    .force("x", d3.forceX(W / 2).strength(0.12))
    .force("y", d3.forceY(H / 2).strength(0.14))
    .force("collide", d3.forceCollide(52))
    .stop();
  sim.tick(300);
  const edge = g.append("g").selectAll("path").data(links).join("path")
    .attr("class", (l) => "edge " + l.kind).attr("marker-end", (l) => (l.kind === "rel" ? "url(#arrow)" : null)).style("color", "var(--text-secondary)");
  const labels = g.append("g").selectAll("text").data(links.filter((l) => l.kind === "rel")).join("text").attr("class", "edge-label").attr("text-anchor", "middle").text((l) => l.label);
  const node = g.append("g").selectAll("g").data(nodes).join("g")
    .attr("class", (d) => "node" + (d.root ? " root" : "") + (d.metric ? " metric" : ""))
    .attr("tabindex", 0).attr("role", "button").attr("aria-label", (d) => d.label)
    .on("click", (e, d) => select(d.id))
    .on("keydown", (e, d) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); select(d.id); } })
    .call(d3.drag().on("drag", (e, d) => { d.x = e.x; d.y = e.y; position(); }));
  node.append("circle").attr("r", (d) => (d.root ? 30 : 26));
  node.append("text").attr("text-anchor", "middle").attr("dy", (d) => (d.root ? 4 : 2)).text((d) => (d.label.length > 12 ? d.label.slice(0, 11) + "." : d.label));
  node.filter((d) => !d.root).append("text").attr("class", "kind").attr("text-anchor", "middle").attr("dy", 14).text((d) => d.kind);
  function path(l) {
    const dx = l.target.x - l.source.x, dy = l.target.y - l.source.y, dist = Math.hypot(dx, dy) || 1;
    const r = (l.target.root ? 30 : 26) + 2;
    const tx = l.target.x - (dx / dist) * r, ty = l.target.y - (dy / dist) * r;
    const sx = l.source.x + (dx / dist) * 26, sy = l.source.y + (dy / dist) * 26;
    const mx = (sx + tx) / 2 - dy * 0.12, my = (sy + ty) / 2 + dx * 0.12;
    return `M${sx},${sy} Q${mx},${my} ${tx},${ty}`;
  }
  function position() {
    edge.attr("d", path);
    labels.attr("x", (l) => (l.source.x + l.target.x) / 2 - (l.target.y - l.source.y) * 0.06).attr("y", (l) => (l.source.y + l.target.y) / 2 + (l.target.x - l.source.x) * 0.06);
    node.attr("transform", (d) => `translate(${d.x},${d.y})`);
  }
  position();
  const xs = nodes.map((n) => n.x), ys = nodes.map((n) => n.y);
  const bw = Math.max(...xs) - Math.min(...xs) + 140, bh = Math.max(...ys) - Math.min(...ys) + 140;
  const k = Math.min(W / bw, H / bh, 1.1);
  const cx = (Math.min(...xs) + Math.max(...xs)) / 2, cy = (Math.min(...ys) + Math.max(...ys)) / 2;
  svg.call(zoom.transform, d3.zoomIdentity.translate(W / 2 - cx * k, H / 2 - cy * k).scale(k));
  graph = {
    highlight(name) {
      node.classed("selected", (d) => d.id === name);
      edge.classed("dim", (l) => name && l.source.id !== name && l.target.id !== name);
    },
  };
  graph.highlight(selected);
}

function renderSummary() {
  const v = DATA.validation;
  const left = [];
  if (!v) {
    left.push(`<div class="callout info">${ICONS.info}<div><div class="t">Sem validate</div><div class="b">Rode akme validate e depois akme export para ver cobertura e pitfalls aqui.</div></div></div>`);
  } else {
    const cov = v.coverage && v.coverage.available ? v.coverage : null;
    left.push(`<div class="row"><span class="status-dot ${v.ok ? "success" : "error"}"></span><span>${v.ok ? "Validate ok" : "Validate com erros"}</span><span class="label tertiary" style="margin-left:auto">${esc((v.generated_at || "").replace("T", " ").slice(0, 16))}</span></div>`);
    if (cov) {
      left.push(`<div><div class="row"><span>Cobertura</span><span class="secondary" style="margin-left:auto">${cov.mapped} de ${cov.columns} colunas</span></div><div class="bar ${cov.ratio >= 0.8 ? "ok" : ""}"><i style="width:${Math.round(cov.ratio * 100)}%"></i></div></div>`);
      left.push(`<table><thead><tr><th>fonte</th><th>mapeadas</th><th>sem mapping</th></tr></thead><tbody>${Object.entries(cov.by_source).map(([s, x]) => `<tr><td class="mono">${esc(s)}</td><td>${x.mapped}/${x.columns}</td><td class="secondary mono label">${esc(x.unmapped.join(", ")) || "todas mapeadas"}</td></tr>`).join("")}</tbody></table>`);
    } else {
      left.push(`<div class="callout warn">${ICONS.warn}<div><div class="t">Profile ausente</div><div class="b">Rode akme profile para medir a cobertura dos mappings.</div></div></div>`);
    }
    if (v.findings.length) left.push(`<table><thead><tr><th>nivel</th><th>check</th><th>mensagem</th></tr></thead><tbody>${v.findings.map((f) => `<tr><td><span class="status-dot ${f.level === "error" ? "error" : "warning"}"></span>${esc(f.level)}</td><td class="mono label">${esc(f.check)}</td><td class="secondary">${esc(f.message)}</td></tr>`).join("")}</tbody></table>`);
  }
  const pit = v ? v.pitfalls : [];
  const right = pit.length
    ? `<table><thead><tr><th>codigo</th><th>nivel</th><th>elemento</th><th>descricao</th></tr></thead><tbody>${pit.map((p) => `<tr><td class="mono">${esc(p.code)}</td><td><span class="status-dot ${p.level === "critical" || p.level === "important" ? "error" : "warning"}"></span>${esc(p.level)}</td><td class="mono label">${esc(p.subject)}</td><td class="secondary">${esc(p.message)} <span class="tertiary">(${esc(p.source)})</span></td></tr>`).join("")}</tbody></table>`
    : `<div class="callout info">${ICONS.info}<div><div class="t">Nenhum pitfall</div><div class="b">Os checks nativos (P04, P08, P11, P13, P22, P41) nao encontraram problemas${v && v.oops && v.oops.available === false ? ". O OOPS! remoto estava indisponivel" : ""}.</div></div></div>`;
  const req = DATA.requirements;
  $("#summary").innerHTML = `
    <div class="card"><span class="kind">ultimo validate</span><h2 class="h2">Cobertura e findings</h2>${left.join("")}</div>
    <div class="card"><span class="kind">pitfalls</span><h2 class="h2">Armadilhas de modelagem</h2>${right}</div>
    <div class="card"><span class="kind">requisitos</span><h2 class="h2">Proposito e perguntas</h2>
      <p class="p-lg">${esc(req.purpose || "Proposito ainda nao registrado.")}</p>
      ${req.scope ? `<p class="p secondary">${esc(req.scope)}</p>` : ""}
      ${req.users && req.users.length ? `<div class="chips">${req.users.map((u) => `<span class="chip outline">${esc(u)}</span>`).join("")}</div>` : ""}
      ${cqList()}
    </div>`;
}

load().then((d) => {
  DATA = d;
  $("#project-title").textContent = "Ontologia " + (d.project || "");
  $("#version").textContent = "v" + (d.version || "0.0.0");
  renderStats(); renderNav(); renderPanel(); renderGraph(); renderSummary();
  addEventListener("resize", () => renderGraph());
  return detectApi().then((api) => { window.AkmeReview.init(DATA, api); $("#tabs").hidden = false; dispatchEvent(new Event("resize")); });
}).catch((err) => {
  $("#tabs").hidden = false;
  $("#view-ontologia").hidden = false;
  $("#graph-empty").hidden = false;
  $("#graph-empty").innerHTML = `<div><div class="p-lg" style="font-weight:600">Nao foi possivel carregar os dados da ontologia</div><div class="p secondary">${esc(err.message)}. Rode akme export (gera docs/ontology.js) e abra docs/index.html, ou rode akme review.</div></div>`;
});
</script>
</body>
</html>
