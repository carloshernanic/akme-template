<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Protótipo da revisão v2</title>
<style>
  :root { --bg:#10121B; --s1:#141721; --s2:#1b1f2b; --ln:rgba(250,250,251,.10); --ln2:rgba(250,250,251,.42);
    --tx:rgba(250,250,251,.88); --mu:rgba(250,250,251,.62); --ac:#00A9F4; --ok:#4ade80; --er:#f87171; --wa:#fbbf24; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--tx); font:14px/20px Inter, system-ui, sans-serif; }
  button { font:inherit; color:inherit; }
  .mono { font-family:"Roboto Mono", ui-monospace, monospace; font-size:12px; color:var(--mu); }
  .mu { color:var(--mu); font-size:12px; line-height:16px; }
  .lab { display:block; color:var(--mu); font-size:11px; letter-spacing:.08em; text-transform:uppercase; margin:0 0 6px; }
  .req { color:var(--wa); text-transform:none; letter-spacing:0; margin-left:6px; }
  .help { display:block; text-transform:none; letter-spacing:0; font-size:12px; color:var(--mu); margin-top:2px; }
  .app { display:flex; min-height:100vh; }
  aside { width:220px; border-right:1px solid var(--ln); background:var(--s1); padding:16px 0; flex-shrink:0; }
  aside .brand { padding:0 16px 16px; font-weight:700; }
  aside .grp { padding:12px 16px 4px; }
  aside button { display:flex; width:100%; padding:6px 16px; background:none; border:0; text-align:left; cursor:pointer; }
  aside button span:first-child { flex:1; } aside button.on { background:var(--s2); box-shadow:inset 2px 0 0 var(--ac); }
  main { flex:1; min-width:0; padding:24px 28px 100px; max-width:1100px; }
  .steps { display:flex; border:1px solid var(--ln); margin-bottom:24px; }
  .steps button { flex:1; background:none; border:0; border-right:1px solid var(--ln); color:var(--mu); padding:10px 12px; text-align:left; cursor:pointer; }
  .steps button:last-child { border:0; }
  .steps .n { display:inline-flex; width:22px; height:22px; border-radius:99px; align-items:center; justify-content:center; font-size:12px; border:1px solid var(--ln2); margin-right:8px; }
  .steps .cur { background:var(--s2); color:var(--tx); box-shadow:inset 0 -2px 0 var(--ac); }
  .steps .cur .n { background:var(--tx); color:var(--bg); border-color:var(--tx); }
  .steps .done .n { background:var(--ok); color:var(--bg); border-color:var(--ok); }
  h1 { font-size:24px; line-height:32px; font-weight:600; margin:0 0 4px; }
  h2 { font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--mu); font-weight:500; margin:24px 0 8px; }
  .sub { color:var(--mu); margin:0 0 20px; max-width:68ch; }
  .card { border:1px solid var(--ln); background:var(--s1); padding:16px; margin-bottom:12px; scroll-margin-top:20px; }
  .card.flash { box-shadow:0 0 0 2px var(--ac); }
  .cqcard { display:grid; grid-template-columns:1fr 250px; gap:20px; }
  .cqcard .side { border-left:1px solid var(--ln); padding-left:16px; }
  .q { font-size:16px; font-weight:600; margin:4px 0 10px; }
  .chip { display:inline-flex; align-items:center; height:22px; padding:0 8px; border:1px solid var(--ln2); border-radius:99px; font-size:12px; color:var(--mu); margin:0 4px 4px 0; }
  .ev { border-left:2px solid var(--ac); background:var(--s2); padding:6px 10px; font-size:12px; color:var(--mu); margin-top:8px; }
  .dep { border:1px solid var(--wa); color:var(--wa); padding:6px 10px; font-size:12px; margin-top:10px; }
  .dep button { background:none; border:0; color:var(--ac); text-decoration:underline; cursor:pointer; padding:0; font-size:12px; }
  .seg { display:grid; grid-auto-flow:column; grid-auto-columns:1fr; border:1px solid var(--ln2); margin-bottom:4px; }
  .seg.wrap { grid-auto-flow:row; grid-template-columns:1fr 1fr; }
  .seg button { background:none; border:0; border-right:1px solid var(--ln2); color:var(--mu); padding:6px; font-size:13px; cursor:pointer; }
  .seg.wrap button { border-bottom:1px solid var(--ln2); } .seg.wrap button:nth-child(2n) { border-right:0; }
  .seg button:last-child { border-right:0; } .seg button[aria-pressed="true"] { background:var(--tx); color:var(--bg); font-weight:600; }
  .seg.miss { border-color:var(--wa); }
  .hint { font-size:12px; color:var(--mu); margin:0 0 12px; }
  .hint b { color:var(--ac); font-weight:500; }
  .fld { margin-bottom:12px; }
  textarea, input[type=text], select { width:100%; background:var(--bg); border:1px solid var(--ln2); color:var(--tx); font:inherit; padding:6px 10px; resize:vertical; }
  textarea.miss, input.miss, select.miss { border-color:var(--wa); }
  textarea:focus, input:focus, select:focus, button:focus-visible { outline:2px solid var(--ac); outline-offset:1px; }
  .btn { background:none; border:1px solid var(--ln2); padding:6px 14px; cursor:pointer; }
  .btn.pri { background:var(--tx); color:var(--bg); border-color:var(--tx); font-weight:600; }
  .btn.sm { padding:3px 10px; font-size:12px; }
  .btn[aria-disabled="true"] { opacity:.45; }
  .add { display:inline-flex; gap:6px; align-items:center; background:none; border:1px dashed var(--ln2); color:var(--mu); padding:8px 14px; cursor:pointer; margin:4px 0 8px; }
  .add:hover { color:var(--tx); }
  .ucgrid { display:grid; grid-template-columns:repeat(auto-fill, minmax(240px,1fr)); gap:12px; margin-bottom:12px; }
  .uc { border:1px solid var(--ln); background:var(--s1); padding:14px; cursor:pointer; position:relative; text-align:left; display:block; width:100%; }
  .uc:hover { border-color:var(--ln2); }
  .uc[aria-pressed="true"] { border-color:var(--ac); box-shadow:inset 0 0 0 1px var(--ac); }
  .uc .ck { position:absolute; top:12px; right:12px; width:18px; height:18px; border:1px solid var(--ln2); display:flex; align-items:center; justify-content:center; font-size:12px; }
  .uc[aria-pressed="true"] .ck { background:var(--ac); border-color:var(--ac); color:var(--bg); }
  .uc .t { font-weight:600; margin-bottom:4px; padding-right:26px; }
  .foot { position:fixed; left:220px; right:0; bottom:0; background:rgba(20,23,33,.97); border-top:1px solid var(--ln); padding:10px 28px; display:flex; align-items:center; gap:12px; }
  .foot .msg { flex:1; color:var(--mu); font-size:13px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .foot .msg b { color:var(--wa); font-weight:600; }
  .ok { color:var(--ok); }
  .falta { margin-top:6px; font-size:12px; color:var(--wa); }
  .applied { display:flex; align-items:center; gap:10px; border:1px solid var(--ln); padding:10px 14px; margin-bottom:8px; flex-wrap:wrap; }
  .hidden { display:none !important; }
  .out { opacity:.55; }
  .toast { position:fixed; right:24px; bottom:84px; max-width:calc(100vw - 48px); background:var(--s2); border:1px solid var(--ln2); padding:10px 14px; box-shadow:0 4px 8px rgba(0,0,0,.5); z-index:5; }
  .note { border:1px solid var(--ln); padding:8px 12px; margin-bottom:16px; font-size:12px; color:var(--mu); }
  .who { font-size:11px; padding:1px 6px; border:1px solid var(--ln2); margin-left:6px; }
  .who.me { border-color:var(--ac); color:var(--ac); }
  dialog { background:var(--s1); color:var(--tx); border:1px solid var(--ln2); padding:24px; width:min(560px, 92vw); }
  dialog::backdrop { background:rgba(0,0,0,.6); }
  dialog ul { margin:8px 0 16px; padding-left:18px; } dialog li { margin:3px 0; }
  .tip { background:none; border:1px solid var(--ln2); border-radius:99px; width:16px; height:16px; font-size:10px; line-height:14px; padding:0; color:var(--mu); cursor:help; margin-left:4px; vertical-align:1px; }
  @media (max-width: 760px) {
    aside { display:none; } .foot { left:0; padding:8px 16px; } .foot .back { display:none; }
    .cqcard { grid-template-columns:1fr; } .cqcard .side { border:0; padding:0; }
    main { padding:16px 16px 80px; }
    .steps button .mu, .steps button .lbl { display:none; } .steps button { text-align:center; }
    .steps button.cur .lbl { display:inline; }
  }
</style>
</head>
<body>
<div class="app">
  <aside aria-label="Etapas">
    <div class="brand">Akme <span class="mu">ontologia</span></div>
    <div class="grp lab">Revisão</div>
    <button data-go="0"><span>Caso de uso</span><span class="mu" id="sb0"></span></button>
    <button data-go="1"><span>Perguntas</span><span class="mu" id="sb1"></span></button>
    <button data-go="2"><span>Lacunas e divergências</span><span class="mu" id="sb2"></span></button>
  </aside>
  <main>
    <div class="note">Protótipo v2 para navegar: nada é gravado.</div>
    <nav class="steps" id="steps" aria-label="Progresso"></nav>
    <section id="v0"></section>
    <section id="v1" class="hidden"></section>
    <section id="v2" class="hidden"></section>
  </main>
</div>
<div class="foot"><span class="msg" id="msg" aria-live="polite"></span><button class="btn back" id="back">← Voltar</button><button class="btn pri" id="next"></button></div>
<div class="toast hidden" id="toast" role="status"></div>

<dialog id="dlg" aria-labelledby="dlg-t">
  <h1 id="dlg-t" style="font-size:20px">Conferir e salvar</h1>
  <div id="dlg-body"></div>
  <div class="fld"><label class="lab" for="approver">Seu nome<span class="req">obrigatório</span><span class="help">Fica registrado como quem aprovou, com data e hora.</span></label>
    <input type="text" id="approver" autocomplete="name" placeholder="Ex.: Juliana Souza"></div>
  <div style="display:flex; gap:8px; justify-content:flex-end"><button class="btn" id="dlg-cancel">Voltar e ajustar</button><button class="btn pri" id="dlg-ok">Salvar decisões</button></div>
</dialog>

<script>
const TYPES = ["Classificação e hierarquia","Relação entre conceitos","Atributos","Quantidade e agregação","Tempo e estado","Regras e restrições"];
const GLOSS = {
  cq: "Uma pergunta que a ontologia precisa saber responder. Serve para guiar a construção e para testar no fim.",
  uso: "Construção: a IA usa a pergunta como exemplo para montar a ontologia. Teste: a pergunta fica escondida e serve para conferir no fim se a ontologia acerta.",
  lacuna: "Uma pergunta que os dados atuais não conseguem responder.",
  div: "Duas fontes definem o mesmo termo de jeitos diferentes. É preciso dizer qual vale.",
};
const S = {
  step: 0,
  ucs: [
    { id:"UC-01", name:"Carteira e faturamento", desc:"Acompanhar faturamento por região e clientes que pararam de comprar.", who:"analista comercial", src:"briefing.docx, p. 2", sel:false, ai:true },
    { id:"UC-02", name:"Mix de produtos", desc:"Entender quais categorias puxam o ticket médio.", who:"gerente de categoria", src:"reuniao-kickoff.md", sel:false, ai:true },
    { id:"UC-03", name:"Crédito e inadimplência", desc:"Ver clientes com pedidos faturados e não pagos.", who:"financeiro", src:"glossario.md, linha 40", sel:false, ai:true },
  ],
  own: null,
  cqs: [
    { id:"CQ-001", q:"Qual o faturamento por UF no último trimestre?", type:"Quantidade e agregação", concepts:"Pedido, Cliente, Faturamento", ev:["pedidos.csv · vl_total","vl_total por pedido, com status FATURADO"], uc:"UC-01", aiPrio:"Alta", dep:null },
    { id:"CQ-002", q:"Quais clientes ativos não compraram nos últimos 90 dias?", type:"Tempo e estado", concepts:"Cliente, Pedido", ev:["glossario.md · linha 17","cliente ativo é quem tem pedido faturado nos últimos 180 dias"], uc:"UC-01", aiPrio:"Média", dep:"D-01" },
    { id:"CQ-004", q:"Qual o ticket médio por categoria no mês?", type:"Quantidade e agregação", concepts:"Produto, ItemPedido", ev:["itens.csv · vl_item","valor do item, por categoria do produto"], uc:"UC-02", aiPrio:"Baixa", dep:null },
  ].map(c => Object.assign(c, { by:"ia", dec:null, prio:null, use:null, reason:"", answer:"" })),
  nextId: 5,
  applied: [{ id:"CQ-003", q:"Quais clientes têm mais de um endereço de entrega?", prio:"Baixa", use:"Teste", by:"Ana Lima", when:"28/10" }],
  gap: { id:"L-01", q:"Quais pedidos foram entregues com atraso?", why:"Os dados não têm data de entrega.", from:"pedido do caso de uso UC-01", dec:null, reason:"" },
  div: { id:"D-01", term:"cliente ativo", a:["financeiro","glossario.md · linha 17","pedido faturado nos últimos 180 dias"], b:["ERP","clientes.csv · fl_ativo","campo fl_ativo do cadastro"], aiSug:"A (financeiro): o glossário é a definição oficial do cliente", affects:["CQ-002"], dec:null, reason:"" },
};
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $ = (id) => document.getElementById(id);

// ---------- regras
const ownOk = () => S.own && S.own.name.trim() && S.own.desc.trim();
const activeUCs = () => [...S.ucs.filter(u => u.sel), ...(ownOk() ? [{ id:"UC-04", name:S.own.name.trim() }] : [])];
const ucName = (id) => (S.ucs.find(u => u.id === id) || (id === "UC-04" && ownOk() ? { name:S.own.name.trim() } : null) || {}).name;
const inScope = (c) => activeUCs().some(u => u.id === c.uc);
function missUC() {
  const m = [];
  if (S.own && !ownOk()) m.push("completar o caso de uso escrito por você");
  if (!activeUCs().length) m.push("escolher pelo menos um caso de uso");
  return m;
}
function missCQ(c) {
  const m = [];
  if (c.by === "me") { if (!c.q.trim()) m.push("texto da pergunta"); if (!c.type) m.push("tipo"); if (!c.uc) m.push("caso de uso"); }
  if (!c.dec) m.push("decisão");
  if (c.dec === "rej" && !c.reason.trim()) m.push("motivo");
  if (c.dec === "ok") { if (!c.prio) m.push("prioridade"); if (!c.use) m.push("uso"); if (c.use === "teste" && !c.answer.trim()) m.push("resposta esperada"); }
  return m;
}
const missGD = (x) => { const m = []; if (!x.dec) m.push("decisão"); if (!x.reason.trim()) m.push("motivo"); return m; };
const scopedCQs = () => S.cqs.filter(inScope);
const missStep = [
  () => missUC(),
  () => scopedCQs().flatMap(c => missCQ(c).map(x => x + " em " + c.id)),
  () => [...missGD(S.gap).map(x => x + " na lacuna"), ...missGD(S.div).map(x => x + " na divergência")],
];
const done = (i) => !missStep[i]().length && (i !== 1 || activeUCs().length > 0);

// ---------- pecas
function seg(name, opts, val, miss, wrap) {
  return `<div class="seg${miss ? " miss" : ""}${wrap ? " wrap" : ""}" role="group">${opts.map(([v,l]) => `<button type="button" data-seg="${name}" data-v="${v}" aria-pressed="${v===val}">${l}</button>`).join("")}</div>`;
}
const tip = (k) => `<button type="button" class="tip" title="${esc(GLOSS[k])}" aria-label="${esc(GLOSS[k])}" data-tip="${k}">?</button>`;
const lab = (t, req, help, forId) => `<label class="lab"${forId ? ` for="${forId}"` : ""}>${t}${req ? `<span class="req">${req}</span>` : ""}${help ? `<span class="help">${help}</span>` : ""}</label>`;
const falta = (key) => `<div class="falta" data-falta="${key}"></div>`;

// ---------- tela 1
function renderUC() {
  const own = S.own;
  $("v0").innerHTML = `
    <h1>Caso de uso</h1>
    <p class="sub">Para que serve esta ontologia? A IA leu os documentos e sugeriu três. Marque os que valem para este projeto, ou escreva o seu. As perguntas da próxima etapa seguem o que você escolher.</p>
    <div class="ucgrid">${S.ucs.map((u,i) => `
      <button type="button" class="uc" data-uc="${i}" aria-pressed="${u.sel}">
        <span class="ck" aria-hidden="true">${u.sel?"✓":""}</span>
        <div class="t">${esc(u.name)}</div>
        <div style="margin-bottom:8px">${esc(u.desc)}</div>
        <span class="chip">${esc(u.who)}</span>
        <div class="mono" style="margin-top:6px">sugerido pela IA · ${esc(u.src)}</div>
      </button>`).join("")}
    </div>
    ${own ? `<div class="card" style="border-color:var(--ac)">
        <div class="mono" style="margin-bottom:8px">escrito por você</div>
        <div class="fld">${lab("Nome", "obrigatório", "", "own-name")}<input type="text" id="own-name" data-own="name" class="${own.name.trim()?"":"miss"}" placeholder="Ex.: Giro de estoque" value="${esc(own.name)}"></div>
        <div class="fld">${lab("O que precisa responder", "obrigatório · uma frase", "", "own-desc")}<input type="text" id="own-desc" data-own="desc" class="${own.desc.trim()?"":"miss"}" placeholder="Ex.: saber quais produtos ficam parados mais de 60 dias" value="${esc(own.desc)}"></div>
        <button type="button" class="btn sm" data-act="own-off">Remover</button>
      </div>`
      : `<button type="button" class="add" data-act="own-on">+ Escrever o meu caso de uso <span class="mu">(nome e uma frase)</span></button>`}
  `;
}

// ---------- tela 2
function cqCard(c) {
  const mine = c.by === "me";
  const head = `<div class="mono">${c.id}<span class="who${mine?" me":""}">${mine ? "escrita por você" : "sugerida pela IA"}</span> · ${esc(ucName(c.uc) || "sem caso de uso")}</div>`;
  const left = mine ? `
      ${head}
      <div class="fld" style="margin-top:8px">${lab("Pergunta", "obrigatório", "", "q-"+c.id)}<textarea id="q-${c.id}" rows="2" data-f="q:${c.id}" class="${c.q.trim()?"":"miss"}" placeholder="Ex.: Quais produtos ficaram sem venda no último mês?">${esc(c.q)}</textarea></div>
      <div class="fld">${lab("Tipo", "obrigatório", "", "t-"+c.id)}<select id="t-${c.id}" data-f="type:${c.id}" class="${c.type?"":"miss"}"><option value="">escolha</option>${TYPES.map(t => `<option${t===c.type?" selected":""}>${t}</option>`).join("")}</select></div>
      <div class="fld">${lab("Caso de uso", "obrigatório", "", "u-"+c.id)}<select id="u-${c.id}" data-f="uc:${c.id}" class="${c.uc?"":"miss"}"><option value="">escolha</option>${activeUCs().map(u => `<option value="${u.id}"${u.id===c.uc?" selected":""}>${esc(u.name)}</option>`).join("")}</select></div>
      <div class="fld">${lab("Conceitos", "", "opcional · separe por vírgula", "k-"+c.id)}<input type="text" id="k-${c.id}" data-f="concepts:${c.id}" value="${esc(c.concepts)}" placeholder="Ex.: Produto, Pedido"></div>
      <button type="button" class="btn sm" data-act="del-cq" data-id="${c.id}">Remover pergunta</button>`
    : `
      ${head}
      <div class="q">${esc(c.q)}</div>
      <span class="chip">${esc(c.type)}</span>${c.concepts.split(",").map(x => `<span class="chip">${esc(x.trim())}</span>`).join("")}
      <div class="ev"><span class="mono" style="color:var(--ac)">${esc(c.ev[0])}</span> · “${esc(c.ev[1])}”</div>
      ${c.dep ? `<div class="dep">⚠ Depende de como “${esc(S.div.term)}” for definido. <button type="button" data-act="goto" data-target="card-${c.dep}">Ver a divergência ${c.dep}</button></div>` : ""}`;
  return `<article class="card cqcard" id="card-${c.id}">
    <div>${left}</div>
    <div class="side">
      ${lab("Decisão", "obrigatório")}${seg("dec:"+c.id, [["ok","Aceitar"],["rej","Rejeitar"]], c.dec, !c.dec)}<div style="height:10px"></div>
      ${c.dec === "rej" ? `<div class="fld">${lab("Motivo", "obrigatório", "", "r-"+c.id)}<textarea id="r-${c.id}" rows="2" data-f="reason:${c.id}" class="${c.reason.trim()?"":"miss"}" placeholder="Por que não serve?">${esc(c.reason)}</textarea></div>` : ""}
      ${c.dec === "ok" ? `
        ${lab("Prioridade", "obrigatório")}${seg("prio:"+c.id, [["Alta","Alta"],["Média","Média"],["Baixa","Baixa"]], c.prio, !c.prio)}
        ${c.aiPrio && !mine ? `<p class="hint">A IA sugere <b>${c.aiPrio}</b></p>` : `<div style="height:10px"></div>`}
        ${lab("Uso " + tip("uso"), "obrigatório")}${seg("use:"+c.id, [["construcao","Construção"],["teste","Teste"]], c.use, !c.use)}
        <p class="hint">${c.use === "teste" ? "Fica escondida da IA e confere o resultado no fim." : "Construção: a IA usa como exemplo. Teste: confere no fim."}</p>
        ${c.use === "teste" ? `<div class="fld">${lab("Resposta esperada", "obrigatório", "Descreva o que deve vir, não precisa do número. Ex.: “uma linha por UF com a soma faturada”.", "a-"+c.id)}<textarea id="a-${c.id}" rows="2" data-f="answer:${c.id}" class="${c.answer.trim()?"":"miss"}">${esc(c.answer)}</textarea></div>` : ""}` : ""}
      ${falta(c.id)}
    </div>
  </article>`;
}
function renderCQ() {
  const act = activeUCs();
  const groups = act.map(u => ({ u, list: S.cqs.filter(c => c.uc === u.id) }));
  const noUc = S.cqs.filter(c => c.by === "me" && !c.uc);
  const out = S.cqs.filter(c => c.uc && !inScope(c));
  $("v1").innerHTML = `
    <h1>Perguntas de competência ${tip("cq")}</h1>
    <p class="sub">O que a ontologia precisa saber responder. Aceite as que fazem sentido e rejeite as que não servem, dizendo por quê.</p>
    ${!act.length ? `<div class="card">Escolha um caso de uso na etapa 1 para ver as perguntas. <button type="button" class="btn sm" data-go="0">Ir para casos de uso</button></div>` : ""}
    ${groups.map(g => `<h2>${esc(g.u.name)} · ${g.list.filter(c => missCQ(c).length).length} para decidir</h2>${g.list.length ? g.list.map(cqCard).join("") : '<p class="mu">Nenhuma pergunta ainda.</p>'}`).join("")}
    ${noUc.map(cqCard).join("")}
    ${act.length ? `<button type="button" class="add" data-act="new-cq">+ Escrever uma pergunta</button>` : ""}
    ${out.length ? `<h2>Fora dos casos escolhidos · ${out.length}</h2><p class="mu" style="margin:0 0 8px">Não entram nesta revisão. Marque o caso de uso na etapa 1 para decidir.</p>${out.map(c => `<div class="applied out"><span class="mono">${c.id}</span><span style="flex:1">${esc(c.q)}</span><span class="chip">${esc(ucName(c.uc))}</span></div>`).join("")}` : ""}
    <h2>Já aplicadas · ${S.applied.length}</h2>
    ${S.applied.map(a => `<div class="applied"><span class="mono">${a.id}</span><span style="flex:1; min-width:200px">${esc(a.q)}</span><span class="chip">${a.prio}</span><span class="chip">${a.use}</span><span class="mu">aprovada por ${esc(a.by)} em ${a.when}</span></div>`).join("")}
  `;
}

// ---------- tela 3
function renderGD() {
  const g = S.gap, d = S.div;
  $("v2").innerHTML = `
    <h1>Lacunas e divergências</h1>
    <p class="sub">Por último: o que os dados não respondem e onde as fontes discordam.</p>
    <h2>Lacuna ${tip("lacuna")}</h2>
    <article class="card cqcard" id="card-${g.id}">
      <div>
        <div class="mono">${g.id} · ${esc(g.from)}</div>
        <div class="q">${esc(g.q)}</div>
        <div class="mu">${esc(g.why)}</div>
      </div>
      <div class="side">
        ${lab("O que fazer", "obrigatório")}${seg("gdec", [["req","Pedir o dado ao cliente"],["ref","Reformular a pergunta"],["drop","Descartar"],["open","Deixar em aberto"]], g.dec, !g.dec, true)}
        <p class="hint">${({req:"Entra na lista de dados a pedir ao cliente.",ref:"Volta para a etapa de perguntas com outro texto.",drop:"Sai da revisão; fica no histórico.",open:"Volta na próxima rodada de revisão."})[g.dec] || "&nbsp;"}</p>
        <div class="fld">${lab("Motivo", "obrigatório", "", "g-r")}<textarea id="g-r" rows="2" data-f="greason" class="${g.reason.trim()?"":"miss"}">${esc(g.reason)}</textarea></div>
        ${falta("gap")}
      </div>
    </article>
    <h2>Divergência ${tip("div")}</h2>
    <article class="card cqcard" id="card-${d.id}">
      <div>
        <div class="mono">${d.id} · afeta ${d.affects.map(id => `<button type="button" class="mono" style="background:none;border:0;color:var(--ac);text-decoration:underline;cursor:pointer;padding:0" data-act="goto" data-target="card-${id}">${id}</button>`).join(", ")}</div>
        <div class="q">“${esc(d.term)}”</div>
        <div class="ev"><b>A</b> · ${esc(d.a[0])} · <span class="mono">${esc(d.a[1])}</span><br>${esc(d.a[2])}</div>
        <div class="ev" style="border-color:var(--wa)"><b>B</b> · ${esc(d.b[0])} · <span class="mono">${esc(d.b[1])}</span><br>${esc(d.b[2])}</div>
      </div>
      <div class="side">
        ${lab("Qual vale", "obrigatório")}${seg("ddec", [["a","Vale A"],["b","Vale B"],["dist","São coisas diferentes"],["exp","Perguntar ao especialista"],["open","Deixar em aberto"]], d.dec, !d.dec, true)}
        <p class="hint">A IA sugere <b>${esc(d.aiSug)}</b></p>
        <div class="fld">${lab("Motivo", "obrigatório", "", "d-r")}<textarea id="d-r" rows="2" data-f="dreason" class="${d.reason.trim()?"":"miss"}">${esc(d.reason)}</textarea></div>
        ${falta("div")}
      </div>
    </article>
  `;
}

// ---------- moldura
function renderChrome() {
  const names = ["Caso de uso", "Perguntas", "Lacunas e divergências"];
  const info = [
    () => { const n = activeUCs().length; return n ? n + (n === 1 ? " escolhido" : " escolhidos") : "nenhum escolhido"; },
    () => { const l = scopedCQs(); return (l.length - l.filter(c => missCQ(c).length).length) + " de " + l.length + " decididas"; },
    () => ([S.gap, S.div].filter(x => !missGD(x).length).length) + " de 2 decididas",
  ];
  $("steps").innerHTML = names.map((n,i) => { const ok = done(i) && i !== S.step; return `<button type="button" data-go="${i}" class="${i===S.step?"cur":""} ${ok?"done":""}"${i===S.step?' aria-current="step"':""}><span class="n">${ok ? "✓" : i+1}</span><span class="lbl">${n}</span> <span class="mu">· ${info[i]()}</span></button>`; }).join("");
  [0,1,2].forEach(i => { $("v"+i).classList.toggle("hidden", i !== S.step); $("sb"+i).textContent = done(i) ? "✓" : (i ? missStep[i]().length ? "!" : "" : ""); });
  document.querySelectorAll("aside button[data-go]").forEach(a => a.classList.toggle("on", +a.dataset.go === S.step));
  // falta por card, atualizado ao digitar
  document.querySelectorAll("[data-falta]").forEach(el => {
    const k = el.dataset.falta, m = k === "gap" ? missGD(S.gap) : k === "div" ? missGD(S.div) : missCQ(S.cqs.find(c => c.id === k));
    el.innerHTML = m.length ? "Falta: " + m.join(", ") : '<span class="ok">✓ pronto</span>';
  });
  const here = missStep[S.step]();
  const others = [0,1,2].filter(i => i !== S.step && !done(i));
  let msg;
  if (here.length) msg = `<b>Falta:</b> ${esc(here[0])}${here.length > 1 ? ` e mais ${here.length - 1}` : ""}`;
  else if (S.step === 2 && others.length) msg = `<b>Falta terminar:</b> ${others.map(i => names[i]).join(" e ")}`;
  else msg = '<span class="ok">✓ Etapa completa</span>';
  $("msg").innerHTML = msg;
  $("back").style.visibility = S.step ? "visible" : "hidden";
  $("next").textContent = S.step === 0 ? "Ir para perguntas →" : S.step === 1 ? "Ir para lacunas →" : "Conferir e salvar";
  const can = S.step < 2 ? done(S.step) : [0,1,2].every(done);
  $("next").setAttribute("aria-disabled", String(!can));
}
function render() { renderUC(); renderCQ(); renderGD(); renderChrome(); }
function go(i) { S.step = i; window.scrollTo(0,0); render(); }
function toast(t) { const el = $("toast"); el.innerHTML = t; el.classList.remove("hidden"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.add("hidden"), 3500); }
function refocus(sel) { const el = document.querySelector(sel); if (el) el.focus(); }

// ---------- eventos
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-go],[data-uc],[data-seg],[data-act],[data-tip]");
  if (!t) return;
  if (t.dataset.tip) { toast(esc(GLOSS[t.dataset.tip])); return; }
  if (t.dataset.go !== undefined) return go(+t.dataset.go);
  if (t.dataset.uc !== undefined) { const u = S.ucs[+t.dataset.uc]; u.sel = !u.sel; render(); return refocus(`[data-uc="${t.dataset.uc}"]`); }
  const a = t.dataset.act;
  if (a === "own-on") { S.own = { name:"", desc:"" }; render(); return refocus("#own-name"); }
  if (a === "own-off") { S.own = null; S.cqs.forEach(c => { if (c.uc === "UC-04") c.uc = ""; }); return render(); }
  if (a === "new-cq") { const id = "CQ-" + String(S.nextId++).padStart(3, "0"); const only = activeUCs().length === 1 ? activeUCs()[0].id : ""; S.cqs.push({ id, by:"me", q:"", type:"", concepts:"", uc:only, ev:[], dep:null, dec:null, prio:null, use:null, reason:"", answer:"" }); render(); return refocus("#q-" + id); }
  if (a === "del-cq") { S.cqs = S.cqs.filter(c => c.id !== t.dataset.id); return render(); }
  if (a === "goto") {
    const id = t.dataset.target, step = id.startsWith("card-CQ") ? 1 : 2;
    if (step !== S.step) { S.step = step; render(); }
    const el = $(id); if (el) { el.scrollIntoView({ behavior:"smooth", block:"start" }); el.classList.add("flash"); setTimeout(() => el.classList.remove("flash"), 1500); }
    return;
  }
  if (t.dataset.seg) {
    const [k, id] = t.dataset.seg.split(":"), v = t.dataset.v;
    if (k === "gdec") S.gap.dec = v; else if (k === "ddec") S.div.dec = v;
    else {
      const c = S.cqs.find(x => x.id === id);
      if (k === "dec" && c.dec !== v) { c.dec = v; c.prio = null; c.use = null; c.answer = ""; c.reason = ""; }
      if (k === "prio") c.prio = v;
      if (k === "use") { c.use = v; if (v !== "teste") c.answer = ""; }
    }
    render(); return refocus(`[data-seg="${t.dataset.seg}"][data-v="${v}"]`);
  }
});
function onField(e) {
  const t = e.target;
  if (t.dataset.own) { S.own[t.dataset.own] = t.value; }
  else if (t.dataset.f) {
    const [k, id] = t.dataset.f.split(":");
    if (k === "greason") S.gap.reason = t.value; else if (k === "dreason") S.div.reason = t.value;
    else S.cqs.find(x => x.id === id)[k] = t.value;
    if (e.type === "change" && t.tagName === "SELECT") { const sel = "#" + t.id; render(); return refocus(sel); }
  } else return;
  if (t.tagName !== "SELECT") t.classList.toggle("miss", !t.value.trim() && !(t.dataset.f || "").startsWith("concepts"));
  renderChrome();
}
document.addEventListener("input", onField);
document.addEventListener("change", onField);
$("back").onclick = () => go(Math.max(0, S.step - 1));
$("next").onclick = () => {
  if ($("next").getAttribute("aria-disabled") === "true") {
    const i = S.step < 2 ? S.step : [0,1,2].find(x => !done(x));
    const m = missStep[i]();
    toast(`<b style="color:var(--wa)">Ainda falta</b> ${esc(m.length ? m.slice(0,4).join("; ") : "escolher um caso de uso")}${m.length > 4 ? "…" : ""}`);
    if (i !== S.step) go(i);
    return;
  }
  if (S.step < 2) return go(S.step + 1);
  openSummary();
};
function openSummary() {
  const l = scopedCQs();
  const acc = l.filter(c => c.dec === "ok"), rej = l.filter(c => c.dec === "rej");
  const G = { req:"pedir o dado ao cliente", ref:"reformular a pergunta", drop:"descartar", open:"deixar em aberto" };
  const D = { a:"vale A ("+S.div.a[0]+")", b:"vale B ("+S.div.b[0]+")", dist:"são coisas diferentes", exp:"perguntar ao especialista", open:"deixar em aberto" };
  $("dlg-body").innerHTML = `<p class="mu">Isto vai para revisão do agente com o seu nome:</p><ul>
    <li><b>Casos de uso:</b> ${activeUCs().map(u => esc(u.name)).join(", ")}</li>
    <li><b>${acc.length} perguntas aceitas</b>: ${acc.filter(c => c.use === "construcao").length} para construção e ${acc.filter(c => c.use === "teste").length} para teste</li>
    <li><b>${rej.length} rejeitadas</b>${rej.length ? " (" + rej.map(c => c.id).join(", ") + ")" : ""}</li>
    ${S.cqs.some(c => c.by === "me") ? `<li><b>${S.cqs.filter(c => c.by === "me").length} escritas por você</b></li>` : ""}
    <li><b>Lacuna ${S.gap.id}:</b> ${G[S.gap.dec]}</li>
    <li><b>Divergência ${S.div.id}:</b> ${D[S.div.dec]}</li></ul>`;
  $("dlg").showModal(); $("approver").focus();
}
$("dlg-cancel").onclick = () => $("dlg").close();
$("dlg-ok").onclick = () => {
  const n = $("approver").value.trim();
  if (!n) { $("approver").classList.add("miss"); $("approver").focus(); return; }
  $("dlg").close();
  toast(`<span class="ok">✓</span> Decisões salvas por ${esc(n)} às ${new Date().toLocaleTimeString("pt-BR", { hour:"2-digit", minute:"2-digit" })} (protótipo: nada foi gravado)`);
};
render();
</script>
</body>
</html>
